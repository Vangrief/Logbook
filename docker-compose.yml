services:
  flightarchive:
    build: .
    # Pre-built image alternative (uncomment if pushing to a registry):
    # image: flightarchive:latest
    container_name: flightarchive
    restart: unless-stopped
    ports:
      # Host 8080 -> container 8080. Reachable at http://10.0.10.90:8080
      - "8080:8080"
    environment:
      - DATABASE_PATH=/data/flightarchive.db
      # Optional bootstrap of OpenSky credentials via .env (otherwise set them
      # in the Settings page). These are NOT required at build time.
      - TZ=${TZ:-Europe/Zurich}
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID:-}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET:-}
    volumes:
      # Unraid appdata share holds the SQLite database persistently.
      - /mnt/user/appdata/flightarchive:/data
